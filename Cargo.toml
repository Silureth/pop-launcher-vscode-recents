[package]
name = "pop-launcher-vscode-recents"
version = "1.1.0"
edition = "2024"
description = "pop-launcher plugin to search and open recent VS Code folders and workspaces"
repository = "https://github.com/Silureth/pop-launcher-vscode-recents"
license = "MIT"

[[bin]]
name = "vscode-open-recent"
path = "src/main.rs"

[dependencies]
nucleo-matcher = "0.3"
percent-encoding = "2"
pop-launcher = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
